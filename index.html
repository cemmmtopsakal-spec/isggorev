<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İSG Görev Takip</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey:            "AIzaSyCb73eIDEOF83NMdOsbjcj3XT9IHkUKLDY",
  authDomain:        "isgtakip-ded68.firebaseapp.com",
  databaseURL:       "https://isgtakip-ded68-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "isgtakip-ded68",
  storageBucket:     "isgtakip-ded68.firebasestorage.app",
  messagingSenderId: "856479189162",
  appId:             "1:856479189162:web:5f2778210c682e07dae8d3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const TASKS_REF = db.ref('isg_gorev_takip/tasks');

window.addEventListener('DOMContentLoaded', () => {
  TASKS_REF.on('value', (snapshot) => {
    const data = snapshot.val();
    window._fbTasks = data ? Object.values(data) : [];
    if (typeof window._onFbUpdate === 'function') window._onFbUpdate();
    setSyncDot(true);
  }, () => setSyncDot(false));

  window._fbSave = (tasks) => {
    const obj = {};
    tasks.forEach(t => { obj[t.id] = t; });
    TASKS_REF.set(obj);
  };
  window._fbUpdate = (task) => db.ref('isg_gorev_takip/tasks/' + task.id).update(task);
  window._fbDelete = (id)   => db.ref('isg_gorev_takip/tasks/' + id).remove();
  window._fbReady  = true;
});

function setSyncDot(ok) {
  const el = document.getElementById('sync-dot');
  if (el) { el.style.background = ok ? '#639922' : '#D4537E'; el.title = ok ? 'Senkronize ✓' : 'Bağlantı yok'; }
}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0efeb;
  --surface: #ffffff;
  --surface2: #e8e7e3;
  --border: rgba(0,0,0,0.1);
  --border2: rgba(0,0,0,0.2);
  --text: #1a1a18;
  --text2: #5f5e5a;
  --text3: #9a9994;
  --r: 8px;
  --rl: 10px;
  --sh: 0 1px 2px rgba(0,0,0,0.07);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18;
    --surface: #262624;
    --surface2: #202020;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.18);
    --text: #eeede7;
    --text2: #a0a09a;
    --text3: #686763;
    --sh: 0 1px 2px rgba(0,0,0,0.25);
  }
}

html, body { height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); font-size: 13px; }

#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
}
#topbar h1 { font-size: 14px; font-weight: 600; white-space: nowrap; margin-right: 4px; }
#topbar input {
  flex: 1; min-width: 0;
  padding: 6px 10px; font-size: 12px;
  border: 1px solid var(--border2); border-radius: var(--r);
  background: var(--bg); color: var(--text); outline: none;
}
#topbar input:focus { border-color: #378ADD; }
#topbar select {
  padding: 6px 8px; font-size: 12px; flex-shrink: 0;
  border: 1px solid var(--border2); border-radius: var(--r);
  background: var(--bg); color: var(--text); outline: none; cursor: pointer;
}
#topbar button {
  padding: 6px 13px; font-size: 12px; font-weight: 500; flex-shrink: 0;
  border: 1px solid var(--border2); border-radius: var(--r);
  background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap;
}
#topbar button:hover { background: var(--surface2); }
#topbar button:active { transform: scale(0.97); }

#btn-pdf {
  padding: 6px 13px; font-size: 12px; font-weight: 500; flex-shrink: 0;
  border: 1px solid #378ADD; border-radius: var(--r);
  background: #378ADD; color: #fff; cursor: pointer; white-space: nowrap;
}
#btn-pdf:hover { background: #2a6db5; border-color: #2a6db5; }
#btn-pdf:active { transform: scale(0.97); }

#navbar {
  flex-shrink: 0; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; padding: 0 14px; gap: 2px; overflow-x: auto;
}
#navbar::-webkit-scrollbar { display: none; }
.ntab {
  padding: 7px 12px; font-size: 12px; font-weight: 500;
  color: var(--text2); cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap; user-select: none;
}
.ntab:hover { color: var(--text); }
.ntab.on { color: var(--text); border-bottom-color: #378ADD; }
.ntab .nc {
  display: inline-block; font-size: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 99px; padding: 0 6px; margin-left: 4px; color: var(--text3);
}
.ntab.on .nc { background: #E6F1FB; color: #185FA5; border-color: #B5D4F4; }
@media (prefers-color-scheme: dark) {
  .ntab.on .nc { background: #0c447c; color: #B5D4F4; border-color: #185FA5; }
}

#statsrow {
  flex-shrink: 0; display: flex; gap: 8px;
  padding: 7px 14px; background: var(--bg);
}
.scard {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 4px 12px;
  display: flex; align-items: baseline; gap: 6px;
}
.scard strong { font-size: 15px; font-weight: 600; }
.scard span { font-size: 11px; color: var(--text2); }

#board-wrap { flex: 1; min-height: 0; padding: 0 14px 12px; display: flex; flex-direction: column; }
#board { flex: 1; min-height: 0; display: grid; gap: 8px; }

.col {
  background: var(--surface2); border-radius: var(--rl);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.col-hd {
  flex-shrink: 0; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; color: var(--text2);
  padding: 8px 10px 6px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.col-hd .cc {
  font-size: 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 0 7px; color: var(--text3); font-weight: 400;
}
.cdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

.col-body { flex: 1; overflow-y: auto; padding: 6px; }
.col-body::-webkit-scrollbar { width: 3px; }
.col-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 7px 8px; margin-bottom: 5px; box-shadow: var(--sh);
}
.card:last-child { margin-bottom: 0; }
.ctop { display: flex; align-items: flex-start; gap: 6px; }
.cdott { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.ctxt { flex: 1; font-size: 11.5px; line-height: 1.45; color: var(--text); word-break: break-word; }
.cdel { font-size: 14px; line-height: 1; color: var(--text3); cursor: pointer; padding: 0 2px; flex-shrink: 0; border-radius: 3px; }
.cdel:hover { color: #c0392b; background: #fcebeb; }
.cmeta { display: flex; align-items: center; gap: 5px; margin-top: 5px; padding-left: 12px; flex-wrap: wrap; }
.cfab { font-size: 11px; font-weight: 600; color: var(--text2); background: var(--surface2); border-radius: 4px; padding: 2px 8px; border: 1px solid var(--border2); }
.cdate { font-size: 10px; color: var(--text3); }
.cbtns { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 5px; padding-left: 12px; }
.bmv {
  font-size: 10px; padding: 2px 7px;
  border: 1px solid var(--border2); border-radius: var(--r);
  background: transparent; color: var(--text2); cursor: pointer; white-space: nowrap;
}
.bmv:hover { background: var(--surface2); color: var(--text); }
.empty { font-size: 11px; color: var(--text3); text-align: center; padding: 18px 0; }

#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(50px);
  background: var(--text); color: var(--bg);
  font-size: 12px; padding: 7px 16px; border-radius: var(--r);
  opacity: 0; transition: all .2s; pointer-events: none; z-index: 99;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===================== PRINT / PDF STYLES ===================== */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  html, body {
    height: auto !important;
    overflow: visible !important;
    background: #fff !important;
    color: #111 !important;
    font-size: 11px !important;
  }

  #app { height: auto !important; display: block !important; }

  #topbar { display: none !important; }
  #navbar  { display: none !important; }
  #toast   { display: none !important; }

  /* Stats row — keep visible */
  #statsrow {
    display: flex !important;
    background: #fff !important;
    padding: 8px 0 12px !important;
    gap: 10px !important;
    border-bottom: 1px solid #ddd;
    margin-bottom: 12px;
  }
  .scard {
    background: #f5f5f5 !important;
    border: 1px solid #ccc !important;
    border-radius: 6px !important;
    padding: 4px 14px !important;
  }
  .scard strong { font-size: 14px !important; color: #111 !important; }
  .scard span   { font-size: 10px !important; color: #555 !important; }

  /* Print header injected via JS */
  #print-header {
    display: block !important;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    color: #111;
  }
  #print-meta {
    display: block !important;
    font-size: 10px;
    color: #666;
    margin-bottom: 10px;
  }

  /* Board */
  #board-wrap {
    flex: none !important;
    min-height: 0 !important;
    padding: 0 !important;
    display: block !important;
  }
  #board {
    display: block !important;
    min-height: 0 !important;
  }

  /* Each column becomes a full-width section */
  .col {
    display: block !important;
    overflow: visible !important;
    border-radius: 0 !important;
    background: #fff !important;
    margin-bottom: 14px !important;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .col-hd {
    border-bottom: 2px solid #ddd !important;
    padding: 5px 0 4px !important;
    background: #fff !important;
    color: #333 !important;
    font-size: 9px !important;
    letter-spacing: .08em !important;
  }
  .col-hd .cc {
    background: #eee !important;
    border: 1px solid #ccc !important;
    color: #555 !important;
  }

  .col-body {
    overflow: visible !important;
    padding: 4px 0 !important;
  }

  /* Cards in print: arranged as a 2-column table-like layout */
  .col-body { display: flex !important; flex-wrap: wrap !important; gap: 6px !important; }

  .card {
    background: #fafafa !important;
    border: 1px solid #ddd !important;
    border-radius: 5px !important;
    padding: 6px 8px !important;
    margin-bottom: 0 !important;
    box-shadow: none !important;
    width: calc(50% - 4px) !important;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* Hide move buttons in print */
  .cbtns { display: none !important; }
  .cdel  { display: none !important; }

  .ctxt  { font-size: 10.5px !important; color: #111 !important; }
  .cfab  { font-size: 9px !important; color: #444 !important; background: #eee !important; border-color: #ccc !important; }
  .cdate { font-size: 9px !important; color: #777 !important; }
  .cdott { width: 7px !important; height: 7px !important; margin-top: 3px !important; }
  .empty { color: #999 !important; font-size: 10px !important; }
}
/* ============================================================= */
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>İSG Görev Takip</h1>
    <input id="inp" placeholder="Yeni görev ekle..." onkeydown="if(event.key==='Enter')add()"/>
    <select id="sfab">
      <option value="">Tüm fabrikalar</option>
      <option value="Servis Merkezi">Servis Merkezi</option>
      <option value="Gıda">Gıda</option>
      <option value="Sarkap">Sarkap</option>
      <option value="Endpak">Endpak</option>
      <option value="Easyopen">Easyopen</option>
      <option value="Plastik">Plastik</option>
      <option value="Delron">Delron</option>
      <option value="Aliağa">Aliağa</option>
      <option value="Sarkap Dış Ticaret">Sarkap Dış Ticaret</option>
    </select>
    <select id="ssel">
      <option value="bekliyor">Bekliyor</option>
      <option value="onay">Onay</option>
      <option value="satin">Satın alma</option>
      <option value="merkez">Merkez</option>
      <option value="arge">Arge</option>
      <option value="muhendis">Mühendis</option>
      <option value="tamam">Tamamlandı</option>
    </select>
    <button onclick="add()">+ Ekle</button><div class="spacer" style="flex:1"></div><span id="sync-dot" title="Bağlanıyor..." style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#BA7517;margin-right:4px"></span><span id="hdr-date" style="font-size:11px;color:var(--text3)"></span>
    <button id="btn-pdf" onclick="printReport()">🖨 PDF Rapor</button>
  </div>
  <div id="navbar"></div>

  <!-- Hidden print-only header, shown via CSS print rule -->
  <div id="print-header" style="display:none"></div>
  <div id="print-meta"   style="display:none"></div>

  <div id="statsrow"></div>
  <div id="board-wrap"><div id="board"></div></div>
</div>
<div id="toast"></div>
<div id="loading-msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;flex-direction:column;gap:12px">
  <div style="font-size:22px">☁️</div>
  <div style="font-size:14px;color:var(--text2)">Firebase'e bağlanılıyor...</div>
  <div style="font-size:11px;color:var(--text3)">İlk açılışta birkaç saniye sürebilir</div>
</div>

<script>
const COLS = [
  { id:'bekliyor', label:'Bekliyor',   color:'#888780' },
  { id:'onay',     label:'Onay',       color:'#7F77DD' },
  { id:'satin',    label:'Satın alma', color:'#BA7517' },
  { id:'merkez',   label:'Merkez',     color:'#378ADD' },
  { id:'arge',     label:'Arge',       color:'#D4537E' },
  { id:'muhendis', label:'Mühendis',   color:'#E07B39' },
  { id:'tamam',    label:'Tamamlandı', color:'#639922' }
];
const VIEWS = [
  { id:'all',      label:'Tümü',       cols:['bekliyor','onay','satin','merkez','arge','muhendis','tamam'] },
  { id:'aktif',    label:'Aktif',      cols:['bekliyor','onay','satin','merkez','arge','muhendis'] },
  { id:'bekliyor', label:'Bekliyor',   cols:['bekliyor'] },
  { id:'onay',     label:'Onay',       cols:['onay'] },
  { id:'satin',    label:'Satın alma', cols:['satin'] },
  { id:'merkez',   label:'Merkez',     cols:['merkez'] },
  { id:'arge',     label:'Arge',       cols:['arge'] },
  { id:'muhendis', label:'Mühendis',   cols:['muhendis'] },
  { id:'tamam',    label:'Tamamlandı', cols:['tamam'] }
];
const DEFAULT = [
  {id:'1', text:"Yangın algılama proje çizimleri Cihan Bey'e gönderildi", status:'bekliyor', date:'29.04.2025'},
  {id:'2', text:'Gıda fabrikası panel kablo siparişi verildi, Vedat Bey anakartı takacak', status:'bekliyor', date:'29.04.2025'},
  {id:'3', text:'Sarkap Endpak fabrikası pano içi söndürme sistemleri, Emek Hanım teklif alacak', status:'bekliyor', date:'29.04.2025'},
  {id:'4', text:'Servis merkezi yangın söndürme sistemi, Aygün Bey Yusuf Bey ile konuşacak', status:'bekliyor', date:'29.04.2025'},
  {id:'5', text:'LOTO sistemine geçiş', status:'bekliyor', date:'29.04.2025'},
  {id:'6', text:'Davlumbaz söndürme sistemi için teklif alınacak', status:'bekliyor', date:'29.04.2025'},
  {id:'7', text:'Kompresörlerin maksimum çalışma değerleri, Semih yapamadı, raporlara göre yapılacak', status:'bekliyor', date:'29.04.2025'},
  {id:'8', text:'Bakır levhaların asılması', status:'bekliyor', date:'29.04.2025'},
  {id:'9', text:'Toreks firmasından trafoların periyodik kontrol raporları bekleniyor', status:'bekliyor', date:'29.04.2025'},
  {id:'10',text:'YSC firmasından periyodik raporların gelmesi bekleniyor', status:'bekliyor', date:'29.04.2025'},
  {id:'11',text:'Easyopen için trafo söndürme sistemi, Emek Hanım teklif alacak', status:'bekliyor', date:'29.04.2025'},
  {id:'12',text:'LPG tankının kurulum yılının Ahmet Bey tarafından ibra edilmesi bekleniyor', status:'bekliyor', date:'29.04.2025'},
  {id:'13',text:'Topraklama raporları merkez onayında bekleniyor', status:'bekliyor', date:'04.05.2026'}
];

let curView = 'all';
let tasks = [];

window._onFbUpdate = function() {
  tasks = window._fbTasks || [];
  render();
  const lm = document.getElementById('loading-msg');
  if (lm) lm.remove();
};

function save() {
  if (window._fbReady && window._fbSave) window._fbSave(tasks);
}

function td() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
}

function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 1800);
}

function add() {
  const inp = document.getElementById('inp');
  const v = inp.value.trim(); if (!v) return;
  tasks.push({
    id: Date.now()+'',
    text: v,
    status: document.getElementById('ssel').value,
    fab: document.getElementById('sfab').value,
    date: td()
  });
  inp.value = ''; save(); render(); toast('Görev eklendi');
}

function mv(id, s) {
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = s;
  if (window._fbUpdate) window._fbUpdate(t); else save();
  render();
}

function del(id) {
  if (!confirm('Görevi silmek istiyor musunuz?')) return;
  tasks = tasks.filter(x=>x.id!==id);
  if (window._fbDelete) window._fbDelete(id);
  render(); toast('Silindi');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function printReport() {
  const vdef = VIEWS.find(vd => vd.id === curView);
  const viewLabel = vdef ? vdef.label : 'Tümü';
  const now = new Date();
  const dateStr = String(now.getDate()).padStart(2,'0') + '.' +
                  String(now.getMonth()+1).padStart(2,'0') + '.' +
                  now.getFullYear() + '  ' +
                  String(now.getHours()).padStart(2,'0') + ':' +
                  String(now.getMinutes()).padStart(2,'0');

  document.getElementById('print-header').textContent = 'İSG Görev Takip Raporu — ' + viewLabel;
  document.getElementById('print-meta').textContent = 'Rapor tarihi: ' + dateStr + '  |  Görünüm: ' + viewLabel;

  window.print();
}

function render() {
  document.getElementById('navbar').innerHTML = VIEWS.map(vd => {
    const cnt = vd.id==='all' ? tasks.length
      : vd.id==='aktif' ? tasks.filter(t=>t.status!=='tamam').length
      : tasks.filter(t=>t.status===vd.id).length;
    return `<div class="ntab${curView===vd.id?' on':''}" onclick="curView='${vd.id}';render()">${vd.label}<span class="nc">${cnt}</span></div>`;
  }).join('');

  const total = tasks.length, done = tasks.filter(t=>t.status==='tamam').length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('statsrow').innerHTML = `
    <div class="scard"><strong>${total}</strong><span>Toplam</span></div>
    <div class="scard"><strong>${total-done}</strong><span>Aktif</span></div>
    <div class="scard"><strong>${done}</strong><span>Tamamlandı</span></div>
    <div class="scard"><strong>%${pct}</strong><span>İlerleme</span></div>`;

  const vdef = VIEWS.find(vd=>vd.id===curView);
  const vcols = COLS.filter(c=>vdef.cols.includes(c.id));
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${vcols.length}, minmax(0,1fr))`;

  board.innerHTML = vcols.map(col => {
    const ts = tasks.filter(t=>t.status===col.id);
    const others = COLS.filter(c=>c.id!==col.id);
    const cards = ts.length === 0 ? '<div class="empty">Görev yok</div>'
      : ts.map(t=>`<div class="card">
          <div class="ctop">
            <span class="cdott" style="background:${col.color}"></span>
            <span class="ctxt">${esc(t.text)}</span>
            <span class="cdel" onclick="del('${t.id}')" title="Sil">×</span>
          </div>
          <div class="cmeta">
            <span class="cfab">${esc(t.fab || 'Tüm fabrikalar')}</span>
            <span class="cdate">${t.date}</span>
          </div>
          <div class="cbtns">${others.map(c=>`<button class="bmv" onclick="mv('${t.id}','${c.id}')">${c.label}</button>`).join('')}</div>
        </div>`).join('');
    return `<div class="col">
      <div class="col-hd">
        <span><span class="cdot" style="background:${col.color}"></span>${col.label}</span>
        <span class="cc">${ts.length}</span>
      </div>
      <div class="col-body">${cards}</div>
    </div>`;
  }).join('');
}

render();
